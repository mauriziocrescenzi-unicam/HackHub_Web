<div class="min-h-screen flex flex-col bg-zinc-950 text-zinc-50 font-sans">
  
  <nav class="sticky top-0 z-50 w-full border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
      
      <a routerLink="/" class="flex items-center gap-2 text-3xl font-bold decoration-transparent">
        <span>Hack<span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Hub</span></span>
      </a>

      <div class="hidden lg:flex items-center gap-8">
        <a routerLink="/hackathons" routerLinkActive="text-purple-400" [routerLinkActiveOptions]="{ exact: true }" class="text-zinc-400 hover:text-purple-400 font-medium transition-colors decoration-transparent">Hackathons</a>
        <a routerLink="/teams" routerLinkActive="text-purple-400" [routerLinkActiveOptions]="{ exact: true }" class="text-zinc-400 hover:text-purple-400 font-medium transition-colors decoration-transparent">Teams</a>
      </div>

      <div class="flex items-center gap-4">
        <a routerLink="/login" class="text-zinc-300 hover:text-white font-medium transition-colors decoration-transparent hidden sm:block">Login</a>
        <a routerLink="/register" class="px-5 py-2.5 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white font-medium hover:from-purple-600 hover:to-pink-600 transition-all shadow-lg shadow-purple-500/25 decoration-transparent cursor-pointer">Sign Up</a>
        
        <button class="lg:hidden text-zinc-400 hover:text-white p-2">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>
      
    </div>
  </nav>

  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-zinc-800 bg-zinc-950 py-8 mt-auto">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        
        <div class="text-center md:text-left">
          <span class="text-xl font-bold decoration-transparent block mb-1">
            Hack<span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Hub</span>
          </span>
          <p class="text-zinc-500 text-sm m-0">© 2024 - Developed by Gasparretti & Crescenzi</p>
        </div>
        
        <div class="flex items-center justify-center gap-6 text-sm text-zinc-400">
          <a routerLink="/hackathons" class="hover:text-purple-400 transition-colors decoration-transparent">Hackathons</a>
          <a routerLink="/teams" class="hover:text-purple-400 transition-colors decoration-transparent">Teams</a>
          <a href="" target="_blank" class="hover:text-white transition-colors text-lg">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
        
      </div>
    </div>
  </footer>
  
</div>
