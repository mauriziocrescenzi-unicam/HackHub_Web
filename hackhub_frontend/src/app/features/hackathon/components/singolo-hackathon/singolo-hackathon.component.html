@if (loading()) { 
  <div style="text-align: center; padding: 4rem 0; color: #71717a;"> 
    <p>Caricamento dettagli hackathon...</p> 
  </div> 
} @else { 
  <div class="hero"> 
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1400&q=80" alt="Hero Background" class="hero-img" /> 
    <div class="hero-overlay"></div> 

    <div class="hero-content"> 
      <a routerLink="/hackathons" class="back-link"> 
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> 
          <line x1="19" y1="12" x2="5" y2="12"/> 
          <polyline points="12 19 5 12 12 5"/> 
        </svg> 
        Torna agli Hackathon 
      </a> 

      <span class="status-badge badge-upcoming">{{ hackathon()?.status || 'UPCOMING' }}</span> 
      <h1 class="hero-title">{{ hackathon()?.title || 'Titolo non disponibile' }}</h1> 

      <div class="hero-tags"> 
        <span class="tag">AI</span> 
        <span class="tag">Innovazione</span> 
        <span class="tag">Teamwork</span> 
      </div> 
    </div> 
  </div> 

  <div class="content"> 
    <div class="layout"> 
      <div class="main"> 
        <div class="section"> 
          <h2 class="section-title">Informazioni</h2> 
          <p class="section-text">{{ hackathon()?.description || 'Nessuna descrizione disponibile.' }}</p> 
        </div> 
        </div> 

      <aside class="sidebar"> 
        </aside> 
    </div> 
  </div> 
}
